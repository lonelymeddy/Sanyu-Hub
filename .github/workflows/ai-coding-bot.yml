name: AI Coding Bot

on:
  issues:
    types: [labeled]

jobs:
  solve-issue:
    if: github.event.label.name == 'ai-bot'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Aider
        run: pip install aider-chat

      - name: Configure Git identity
        run: |
          git config user.name "ai-coding-bot[bot]"
          git config user.email "ai-coding-bot[bot]@users.noreply.github.com"

      - name: Create feature branch
        run: |
          BRANCH_NAME="ai-bot/issue-${{ github.event.issue.number }}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV

      - name: Run AI Agent on Issue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          aider --model gemini/gemini-2.5-pro \
                --yes-always \
                --no-stream \
                --message "Resolve GitHub Issue #${{ github.event.issue.number }}: $ISSUE_TITLE. Details: $ISSUE_BODY. Edit the necessary files and ensure everything works cleanly."

      - name: Push changes and open Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(git status --porcelain)" ] || [ "$(git rev-list --count main..HEAD)" -gt 0 ]; then
            git push origin "$BRANCH_NAME"
            gh pr create \
              --title "Fix #${{ github.event.issue.number }}: ${{ github.event.issue.title }}" \
              --body "Automated PR generated by AI Coding Bot for issue #${{ github.event.issue.number }}." \
              --head "$BRANCH_NAME"
          else
            gh issue comment "${{ github.event.issue.number }}" --body "The AI bot ran, but no code changes were produced."
          fi
          
