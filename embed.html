<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Meddy API — Embeddable Video Player</title>
<link rel="stylesheet" href="/css/style.css">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    overflow: hidden;
  }
  .embed-container {
    width: 100%;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .embed-container .live-video-wrapper {
    width: 100%;
    height: 100%;
    max-height: 100vh;
    border-radius: 0;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div class="embed-container">
  <div class="live-video-wrapper" id="embedVideoWrapper">
    <video id="embedVideoPlayer" class="live-video-player" playsinline preload="metadata"></video>

    <!-- TOP OVERLAY BADGE -->
    <div class="player-overlay-top">
      <div class="player-live-badge" id="embedBadge"><span class="live-dot"></span> MEDDY API</div>
    </div>

    <!-- CENTRAL PLAY / PAUSE BUTTON -->
    <button class="live-central-play-btn" id="embedCentralPlayBtn" aria-label="Play or Pause Video">
      <svg class="play-icon" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <svg class="pause-icon" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
    </button>

    <!-- UNMUTE BANNER -->
    <button class="live-unmute-banner" id="embedUnmuteBanner" style="display:none;">
      <span>Audio Muted — Tap to Unmute</span>
    </button>

    <!-- LOADING OVERLAY -->
    <div class="live-loading-overlay" id="embedLoadingOverlay">
      <div class="spinner"></div>
      <div class="loading-text" id="embedLoadingText">Loading stream via Meddy API...</div>
    </div>

    <!-- ERROR OVERLAY -->
    <div class="live-error-overlay" id="embedErrorOverlay" style="display:none;">
      <svg viewBox="0 0 24 24" style="width:48px;height:48px;fill:#06b6d4;margin-bottom:8px;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
      <h3 id="embedErrorTitle">Stream Unavailable</h3>
      <p id="embedErrorMsg">The requested media stream could not be loaded.</p>
      <button class="live-retry-btn" id="embedRetryBtn">Retry Stream</button>
    </div>

    <!-- CONTROLS BAR -->
    <div class="live-controls-bar" id="embedControlsBar">
      <div class="controls-left">
        <button class="ctrl-btn" id="embedCtrlRewindBtn" aria-label="Rewind 10 seconds" style="display:none;">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </button>
        <button class="ctrl-btn" id="embedCtrlPlayPauseBtn" aria-label="Play/Pause">
          <svg class="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <svg class="icon-pause" viewBox="0 0 24 24" style="display:none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="ctrl-btn" id="embedCtrlForwardBtn" aria-label="Forward 10 seconds" style="display:none;">
          <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </button>
      </div>

      <div class="controls-middle">
        <div class="ctrl-progress-container" id="embedCtrlProgressContainer">
          <div class="ctrl-progress-track">
            <div class="ctrl-progress-fill" id="embedCtrlProgressFill"></div>
            <div class="ctrl-progress-thumb" id="embedCtrlProgressThumb"></div>
          </div>
        </div>
        <span class="ctrl-time-display" id="embedCtrlTimeDisplay">0:00 / 0:00</span>
      </div>

      <div class="controls-right">
        <div class="volume-container">
          <button class="ctrl-btn" id="embedCtrlMuteBtn" aria-label="Mute/Unmute">
            <svg class="icon-vol-high" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            <svg class="icon-vol-mute" viewBox="0 0 24 24" style="display:none;"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
          </button>
          <input type="range" class="volume-slider" id="embedCtrlVolumeSlider" min="0" max="1" step="0.05" value="1" aria-label="Volume Slider">
        </div>

        <button class="ctrl-btn" id="embedCtrlSettingsBtn" aria-label="Settings" aria-expanded="false">
          <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        </button>

        <button class="ctrl-btn" id="embedCtrlFullscreenBtn" aria-label="Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>

        <!-- SETTINGS MENU -->
        <div class="player-settings-menu" id="embedCtrlSettingsMenu" style="display:none;">
          <div class="settings-menu-header">
            <span>Playback Settings</span>
            <button class="settings-close-btn" id="embedSettingsCloseBtn">&times;</button>
          </div>
          <div class="settings-menu-body">
            <div class="settings-group" id="embedSpeedSettingsGroup">
              <label>Speed</label>
              <div class="speed-options" id="embedSpeedOptions">
                <button class="speed-btn" data-speed="0.5">0.5x</button>
                <button class="speed-btn" data-speed="0.75">0.75x</button>
                <button class="speed-btn active" data-speed="1">1x</button>
                <button class="speed-btn" data-speed="1.25">1.25x</button>
                <button class="speed-btn" data-speed="1.5">1.5x</button>
                <button class="speed-btn" data-speed="2">2x</button>
              </div>
            </div>
            <div class="settings-group" id="embedQualitySettingsGroup" style="display:none;">
              <label>Quality</label>
              <select class="quality-select" id="embedCtrlQualitySelect"><option value="-1">Auto Quality</option></select>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const params = new URLSearchParams(window.location.search);
    const type = params.get("type") || "tv";
    const id = params.get("id") || "ntv-uganda";

    let streamApiUrl = `/api/stream/${type}/${id}`;
    if (type === "custom" && params.get("url")) {
      streamApiUrl = `/api/stream-proxy?url=${encodeURIComponent(params.get("url"))}`;
    }

    const controller = attachCustomPlayerController({
      wrapper: document.getElementById("embedVideoWrapper"),
      videoPlayer: document.getElementById("embedVideoPlayer"),
      centralPlayBtn: document.getElementById("embedCentralPlayBtn"),
      unmuteBanner: document.getElementById("embedUnmuteBanner"),
      loadingOverlay: document.getElementById("embedLoadingOverlay"),
      loadingText: document.getElementById("embedLoadingText"),
      errorOverlay: document.getElementById("embedErrorOverlay"),
      errorTitle: document.getElementById("embedErrorTitle"),
      errorMsg: document.getElementById("embedErrorMsg"),
      retryBtn: document.getElementById("embedRetryBtn"),
      controlsBar: document.getElementById("embedControlsBar"),
      rewindBtn: document.getElementById("embedCtrlRewindBtn"),
      playPauseBtn: document.getElementById("embedCtrlPlayPauseBtn"),
      forwardBtn: document.getElementById("embedCtrlForwardBtn"),
      progressContainer: document.getElementById("embedCtrlProgressContainer"),
      progressFill: document.getElementById("embedCtrlProgressFill"),
      progressThumb: document.getElementById("embedCtrlProgressThumb"),
      timeDisplay: document.getElementById("embedCtrlTimeDisplay"),
      muteBtn: document.getElementById("embedCtrlMuteBtn"),
      volumeSlider: document.getElementById("embedCtrlVolumeSlider"),
      settingsBtn: document.getElementById("embedCtrlSettingsBtn"),
      settingsMenu: document.getElementById("embedCtrlSettingsMenu"),
      settingsCloseBtn: document.getElementById("embedSettingsCloseBtn"),
      speedSettingsGroup: document.getElementById("embedSpeedSettingsGroup"),
      speedOptions: document.getElementById("embedSpeedOptions"),
      qualitySettingsGroup: document.getElementById("embedQualitySettingsGroup"),
      qualitySelect: document.getElementById("embedCtrlQualitySelect"),
      fullscreenBtn: document.getElementById("embedCtrlFullscreenBtn"),
      isLiveStream: type === "tv" || type === "radio",
      mediaTitle: `Meddy API Stream (${id})`,
      onRetry: () => controller.loadSource(streamApiUrl, { isHls: true })
    });

    if (controller) {
      controller.loadSource(streamApiUrl, { isHls: true });
    }
  });
</script>
</body>
</html>
