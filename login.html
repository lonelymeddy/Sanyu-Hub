<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="description" content="SanyuHub — Log In & Continue Watching">
<title>Welcome Back — SanyuHub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/redesign.css">
</head>
<body class="sh-auth-page">

<div class="sh-auth-wrapper">
  <div class="sh-auth-bg-layer"></div>
  <div class="sh-auth-overlay-layer"></div>

  <div class="sh-auth-card">
    <div class="sh-brand-header">
      <h1 class="sh-brand-logo">Sanyu<span>Hub</span></h1>
      <p class="sh-brand-tagline">Welcome Back — Your next favourite movie is waiting.</p>
    </div>

    <div class="sh-nav-statement">
      Don't have an account yet? <a href="/signup">Sign Up</a>
    </div>

    <div id="errorMsg" class="sh-alert-msg"></div>

    <form id="loginForm">
      <div class="sh-form-group full-width">
        <label class="sh-form-label" for="identifier">Email / Phone / Username</label>
        <div class="sh-input-wrapper">
          <svg class="sh-input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
          <input type="text" id="identifier" class="sh-form-input" required placeholder="Enter email, phone, or username" autocomplete="username">
        </div>
      </div>

      <div class="sh-form-group full-width">
        <label class="sh-form-label" for="password">Password</label>
        <div class="sh-input-wrapper">
          <svg class="sh-input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
          <input type="password" id="password" class="sh-form-input" required placeholder="Enter your password" autocomplete="current-password">
          <button type="button" class="sh-toggle-password" id="toggleLoginPwdBtn" aria-label="Toggle password visibility">
            <svg id="pwdLoginIconEye" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
          </button>
        </div>
      </div>

      <a href="/about/help" class="sh-forgot-link">Forgot Password?</a>

      <button type="submit" class="sh-btn-submit" id="btnLoginSubmit">
        <span>Log In</span>
      </button>
    </form>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    const pwdInput = document.getElementById("password");
    const togglePwdBtn = document.getElementById("toggleLoginPwdBtn");

    togglePwdBtn.addEventListener("click", () => {
      const type = pwdInput.getAttribute("type") === "password" ? "text" : "password";
      pwdInput.setAttribute("type", type);
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const identifier = document.getElementById("identifier").value.trim();
      const password = pwdInput.value;

      if (!identifier || !password) {
        errorMsg.textContent = "Please enter both identifier and password.";
        errorMsg.style.display = "block";
        return;
      }

      const adminEmails = ["delostvoyage@gmail.com", "williambanksug256@gmail.com"];
      const isAdmin = (adminEmails.includes(identifier.toLowerCase()) || identifier === "256702662846");

      const userSession = {
        email: isAdmin ? (adminEmails.includes(identifier.toLowerCase()) ? identifier.toLowerCase() : "delostvoyage@gmail.com") : (identifier.includes("@") ? identifier : identifier + "@sanyuhub.com"),
        phone: isAdmin ? "256702662846" : (identifier.match(/^\d+$/) ? identifier : "256702662846"),
        username: identifier,
        isAdmin: isAdmin,
        paymentSector: "MTN",
        plan: "monthly",
        isTrial: false,
        subscriptionExpiry: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(),
        loginAt: new Date().toISOString()
      };

      if (typeof SanyuAuth !== "undefined" && SanyuAuth.registerUser) {
        SanyuAuth.registerUser(userSession);
      } else {
        localStorage.setItem("sanyuhub_auth_user", JSON.stringify(userSession));
      }

      window.location.href = "/";
    });
  });
</script>
</body>
</html>
