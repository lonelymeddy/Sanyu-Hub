<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="SanyuHub — Log In">
<title>Log In — SanyuHub</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: radial-gradient(circle at center, rgba(30,30,30,0.9) 0%, rgba(10,10,10,0.98) 100%), url('/images/landing-collage.png') center/cover no-repeat;
    position: relative;
    box-sizing: border-box;
  }
  .auth-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(8px);
    z-index: 1;
  }
  .auth-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 440px;
    background: rgba(20, 20, 20, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    box-sizing: border-box;
  }
  .auth-brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .auth-brand h1 {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .auth-brand h1 span {
    color: #f4c400;
  }
  .auth-brand p {
    font-size: 14px;
    color: #aaaaaa;
    margin: 6px 0 0 0;
  }
  .nav-statement {
    background: rgba(244, 196, 0, 0.12);
    border: 1px solid rgba(244, 196, 0, 0.3);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    font-size: 14px;
    color: #ffffff;
    margin-bottom: 24px;
  }
  .nav-statement a {
    color: #f4c400;
    font-weight: 700;
    text-decoration: none;
    margin-left: 6px;
  }
  .nav-statement a:hover {
    text-decoration: underline;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #cccccc;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    height: 46px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 14px;
    color: #ffffff;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #f4c400;
    background: rgba(255, 255, 255, 0.09);
  }
  .btn-submit {
    width: 100%;
    height: 48px;
    background: #f4c400;
    color: #000000;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-submit:hover {
    background: #ffd836;
  }
  .admin-info {
    margin-top: 22px;
    font-size: 11px;
    color: #666666;
    text-align: center;
    line-height: 1.4;
  }
  .error-msg {
    background: rgba(255, 77, 77, 0.15);
    border: 1px solid rgba(255, 77, 77, 0.4);
    color: #ff6b6b;
    font-size: 13px;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 14px;
    display: none;
  }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-overlay"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <h1>Sanyu<span>Hub</span></h1>
      <p>Welcome back! Sign in to continue watching</p>
    </div>

    <div class="nav-statement">
      Don't have an account yet? <a href="/signup">Sign Up</a>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="identifier">Email / Phone / Username</label>
        <input type="text" id="identifier" required placeholder="Enter email, phone, or username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div class="admin-info">
      Need assistance or admin support?<br>
      Email: delostvoyage@gmail.com | Contact: +256702662846
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.getElementById("loginForm");
    const errorMsg = document.getElementById("errorMsg");

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const identifier = document.getElementById("identifier").value.trim();
      const password = document.getElementById("password").value;

      if (!identifier || !password) {
        errorMsg.textContent = "Please enter both identifier and password.";
        errorMsg.style.display = "block";
        return;
      }

      const isAdmin = (identifier.toLowerCase() === "delostvoyage@gmail.com" || identifier === "256702662846");

      const userSession = {
        email: isAdmin ? "delostvoyage@gmail.com" : (identifier.includes("@") ? identifier : identifier + "@sanyuhub.com"),
        phone: isAdmin ? "256702662846" : (identifier.match(/^\d+$/) ? identifier : "256702662846"),
        username: identifier,
        isAdmin: isAdmin,
        paymentSector: "MTN",
        plan: "monthly",
        isTrial: false,
        subscriptionExpiry: new Date(Date.now() + 365 * 24 * 60 * 60 * 1000).toISOString(),
        loginAt: new Date().toISOString()
      };

      if (typeof SanyuAuth !== "undefined" && SanyuAuth.registerUser) {
        SanyuAuth.registerUser(userSession);
      } else {
        localStorage.setItem("sanyuhub_auth_user", JSON.stringify(userSession));
      }

      window.location.href = "/";
    });
  });
</script>
</body>
</html>
