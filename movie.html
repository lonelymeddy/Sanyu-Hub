</nav>

<!-- SIDEBAR OVERLAY -->

<div class="sidebar-content">
<div class="sidebar-section">
<div class="sidebar-section-title">Explore</div>

<a href="/" class="sidebar-link ">
<span class="sidebar-link-left">
<span class="sidebar-dot"></span>
Home
</span>
</a>

<a href="/movies" class="sidebar-link has-submenu expanded active">
<span class="sidebar-link-left">
<span class="sidebar-dot"></span>
Library
</span>
<span class="chevron"></span>

<div class="sidebar-submenu open">
<a href="/trending" class="">Trending Now</a>

</span>
</a>

</div>

<main id="movieDetailPage" style="max-width: 1200px; margin: 0 auto; padding: 20px 5% 40px;">
  <div class="skeleton-detail-hero">
    <div class="skeleton-detail-poster skeleton"></div>
    <div class="skeleton-detail-info">
      <div class="skeleton-detail-title skeleton"></div>
      <div class="skeleton-detail-badges">
        <div class="skeleton-badge skeleton"></div>
        <div class="skeleton-badge skeleton"></div>
        <div class="skeleton-badge skeleton"></div>
      </div>
      <div class="skeleton-detail-paragraph">
        <div class="skeleton-line skeleton" style="width: 95%;"></div>
        <div class="skeleton-line skeleton" style="width: 88%;"></div>
        <div class="skeleton-line skeleton" style="width: 70%;"></div>
      </div>
      <div class="skeleton-detail-action skeleton"></div>
    </div>
  </div>
</main>

<section class="section" style="max-width: 1200px; margin: 0 auto; padding: 0 5% 40px;">
  <div class="section-heading">
    <h2 class="section-title">More Movies You Might Like</h2>
    <a href="/movies" class="view-more">View All</a>
  </div>
  <div class="card-grid" id="relatedMoviesGrid">
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
  </div>
</section>


<script src="/js/app.js"></script>

</html>
