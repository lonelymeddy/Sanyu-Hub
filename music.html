<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="SanyuHub — Music">
<title>Music — SanyuHub</title>
<link rel="stylesheet" href="/css/style.css">
<style>
/* Music Library Minimal List & Selectors Styling */
.music-chart-selectors {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  white-space: nowrap;
  padding: 4px 0 16px 0;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.music-chart-selectors::-webkit-scrollbar {
  display: none;
}
.music-chart-pill {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 8px 18px;
  background: #181818;
  color: #d1d1d1;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 9999px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  flex-shrink: 0;
  user-select: none;
}
.music-chart-pill:hover {
  background: #222222;
  color: #ffffff;
  border-color: rgba(255, 255, 255, 0.25);
}
.music-chart-pill.active {
  background: #FFC800;
  color: #080808;
  border-color: #FFC800;
  box-shadow: 0 2px 8px rgba(255, 200, 0, 0.35);
}
.music-song-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: 100%;
  max-width: 900px;
}
.music-song-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: #111111;
  border: 1px solid rgba(255, 255, 255, 0.05);
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.18s ease, transform 0.18s ease, border-color 0.18s ease;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.music-song-row:hover, .music-song-row:active {
  background: #181818;
  border-color: rgba(255, 200, 0, 0.35);
  transform: translateY(-1px);
}
.music-song-artwork {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 6px;
  object-fit: cover;
  background: #1c1c1c;
  display: block;
}
.music-song-title {
  font-size: 15px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.3;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
}
.music-song-skeleton-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  background: #111111;
  border-radius: 8px;
}
.music-skeleton-art {
  width: 48px;
  height: 48px;
  min-width: 48px;
  border-radius: 6px;
}
.music-skeleton-text {
  flex: 1;
  height: 16px;
  border-radius: 4px;
}
</style>
</head>
<body>

<div class="background"></div>

<header class="navbar" id="navbar">
<div class="nav-inner">
<a href="/" class="logo">
Sanyu<span>Hub</span>
</a>
<nav class="desktop-nav">
<a href="/">Home</a>
<a href="/movies" class="active">Library</a>
<a href="/series">Series</a>
<a href="/live-tv">Live TV</a>
</nav>
<div class="nav-controls">
<button class="search-button" id="topSearch" aria-label="Search">
<span class="search-icon"></span>
</button>
<button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">
<span class="menu-line"></span>
<span class="menu-line"></span>
<span class="menu-line"></span>
</button>
</div>
</div>
</header>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-content">
<div class="sidebar-section">
<div class="sidebar-section-title">Explore</div>
<a href="/" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Home</span></a>
<a href="/movies" class="sidebar-link active"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Library</span></a>
<a href="/series" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Series</span></a>
<a href="/live-tv" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Live TV</span></a>
<a href="/more" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>More</span></a>
</div>
</div>
</aside>

<main>

<header class="page-header">
<div class="page-title-group">
<h1 class="page-title">Library</h1>
<p class="page-subtitle">Discover and play trending music, verified charts, and global releases.</p>
</div>
</header>

<section class="section">
  <!-- Exact layout order: Category navigation -> Search bar -> Top 10 selectors -> Results -->

  <!-- 1. Library category navigation -->
  <div class="categories" id="libraryCategorySelector" style="margin-bottom: 20px;">
    <a href="/movies" class="category">Movies</a>
    <a href="/movies?category=series" class="category">Series</a>
    <a href="/music" class="category active">Music</a>
    <a href="/movies?category=concerts" class="category">Concerts</a>
  </div>

  <!-- FIRST: Music search bar -->
  <div class="movie-search-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px;">
    <input type="search" id="musicSearchInput" class="movie-search-input" style="flex: 1; min-width: 240px;" placeholder="Search worldwide music by title, artist, album..." aria-label="Search worldwide music">
  </div>

  <!-- SECOND: Top 10 selectors -->
  <div class="music-chart-selectors" id="musicChartSelectors" role="tablist" aria-label="Top 10 Music Charts">
    <button class="music-chart-pill active" id="pillUganda" data-chart="uganda" role="tab" aria-selected="true">Top 10 Uganda</button>
    <button class="music-chart-pill" id="pillAfrica" data-chart="africa" role="tab" aria-selected="false">Top 10 Africa</button>
    <button class="music-chart-pill" id="pillGlobal" data-chart="global" role="tab" aria-selected="false">Top 10 Global</button>
  </div>

  <!-- THIRD: Music results list (compact vertical list: artwork + song title only) -->
  <div class="music-song-list" id="musicResultsList">
    <!-- Populated dynamically via JS -->
  </div>
</section>

</main>

  <a href="/movies" class="bottom-nav-item active" id="navMovies"><div class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg></div><span>Library</span></a>
  <a href="/more" class="bottom-nav-item" id="navMore"><div class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg></div><span>More</span></a>
</nav>

<script src="/js/app.js"></script>
</body>
</html>
