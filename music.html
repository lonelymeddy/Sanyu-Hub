<main>

<header class="page-header">
<div class="page-title-group">
<h1 class="page-title">Music</h1>
</div>
</header>

<section class="section">
  <div class="movie-search-bar" style="display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px;">
    <input type="search" id="musicSearchInput" class="movie-search-input" style="flex: 1; min-width: 240px;" placeholder="Search music by title or artist..." aria-label="Search music">
  </div>

  <div class="card-grid" id="musicCardGrid">
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
    <article class="movie-card skeleton-card"><div class="skeleton-poster skeleton"></div><div class="skeleton-line title skeleton"></div><div class="skeleton-line subtitle skeleton"></div></article>
  </div>
</section>

</main>



<script src="/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const musicGrid = document.getElementById("musicCardGrid");
  const musicSearchInput = document.getElementById("musicSearchInput");
  if (!musicGrid) return;

  const MUSIC_STREAMS = [
    {
      id: "trace-mziki-music",
      title: "Trace Mziki Live Broadcast",
      vj: "East African Music",
      year: "2026",
      quality: "HD",
      posterUrl: "/images/tracemziki-logo.png",
      streamUrl: "https://channels.trace.plus/Traceprod/MZIKI_hd/index.m3u8"
    }
  ];

  function renderMusic(searchQuery = "") {
    musicGrid.innerHTML = "";
    const cleanSearch = searchQuery.trim().toLowerCase();
    const filtered = MUSIC_STREAMS.filter(m => {
      if (!cleanSearch) return true;
      return m.title.toLowerCase().includes(cleanSearch) || m.vj.toLowerCase().includes(cleanSearch);
    });

    if (filtered.length === 0) {
      musicGrid.innerHTML = `<div class="loading-state">No results found</div>`;
      return;
    }

    filtered.forEach(m => {
      const card = document.createElement("article");
      card.className = "movie-card";
      card.style.cursor = "pointer";

      card.innerHTML = `
        <div class="poster">
          <img src="${m.posterUrl}" alt="${m.title}">
          <span class="badge">${m.quality}</span>
        </div>
        <div class="card-title" title="${m.title}">${m.title}</div>
        <div class="card-meta">${m.vj} • ${m.year}</div>
      `;

      card.addEventListener("click", () => {
        window.location.href = `/live-tv/watch/trace-mziki/`;
      });

      musicGrid.appendChild(card);
    });
  }

  if (musicSearchInput) {
    musicSearchInput.addEventListener("input", (e) => {
      renderMusic(e.target.value);
    });
  }

  renderMusic();
});
</script>
</body>
</html>
