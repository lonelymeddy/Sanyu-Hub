<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="SanyuHub — User Profile">
<title>Profile — SanyuHub</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="background"></div>

<header class="navbar" id="navbar">
<div class="nav-inner">
<a href="/" class="logo">
Sanyu<span>Hub</span>
</a>
<nav class="desktop-nav">
<a href="/">Home</a>
<a href="/movies">Library</a>
<a href="/series">Series</a>
<a href="/live-tv">Live TV</a>
</nav>
<div class="nav-controls">
<button class="search-button" id="topSearch" aria-label="Search">
<span class="search-icon"></span>
</button>
<button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">
<span class="menu-line"></span>
<span class="menu-line"></span>
<span class="menu-line"></span>
</button>
</div>
</div>
</header>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-content">
<div class="sidebar-section">
<div class="sidebar-section-title">Explore</div>
<a href="/" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Home</span></a>
<a href="/movies" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Library</span></a>
<a href="/series" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Series</span></a>
<a href="/live-tv" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Live TV</span></a>
<a href="/more" class="sidebar-link active"><span class="sidebar-link-left"><span class="sidebar-dot"></span>More</span></a>
</div>
</div>
</aside>

<main>

<header class="page-header">
<div class="page-title-group">
<h1 class="page-title">Profile</h1>
</div>
</header>

<section class="section">
  <div style="max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 32px;">

    <!-- History Section -->
    <div>
      <h2 style="font-size: 16px; font-weight: 700; color: #f4c400; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">History</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/saved" class="more-card" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; text-decoration: none;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #f4c400;"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
            <span style="font-weight: 600; font-size: 15px;">Saved</span>
          </div>
          <span style="color: #666; font-size: 18px;">&rsaquo;</span>
        </a>

        <a href="/continue-watching" class="more-card" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; text-decoration: none;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #f4c400;"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
            <span style="font-weight: 600; font-size: 15px;">Continue Watching</span>
          </div>
          <span style="color: #666; font-size: 18px;">&rsaquo;</span>
        </a>

        <a href="/downloaded" class="more-card" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; text-decoration: none;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #f4c400;"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            <span style="font-weight: 600; font-size: 15px;">Downloaded</span>
          </div>
          <span style="color: #666; font-size: 18px;">&rsaquo;</span>
        </a>
      </div>
    </div>

    <!-- Settings Section -->
    <div>
      <h2 style="font-size: 16px; font-weight: 700; color: #f4c400; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">Settings</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/settings" class="more-card" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; text-decoration: none;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #f4c400;"><path d="M19.43 12.98c.04-.32.07-.64.07-.98s-.03-.66-.07-.98l2.11-1.65c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65C14.46 2.18 14.25 2 14 2h-4c-.25 0-.46.18-.49.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64l2.11 1.65c-.04.32-.07.65-.07.98s.03.66.07.98l-2.11 1.65c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.08.73 1.69.98l.38 2.65c.03.24.24.42.49.42h4c.25 0 .46-.18.49-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1c.23.09.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.65zM12 15.5c-1.93 0-3.5-1.57-3.5-3.5s1.57-3.5 3.5-3.5 3.5 1.57 3.5 3.5-1.57 3.5-3.5 3.5z"/></svg>
            <span style="font-weight: 600; font-size: 15px;">Settings</span>
          </div>
          <span style="color: #666; font-size: 18px;">&rsaquo;</span>
        </a>
      </div>
    </div>

    <!-- About Section -->
    <div>
      <h2 style="font-size: 16px; font-weight: 700; color: #f4c400; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px;">About</h2>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <a href="/about" class="more-card" style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; color: #fff; text-decoration: none;">
          <div style="display: flex; align-items: center; gap: 12px;">
            <svg viewBox="0 0 24 24" style="width: 20px; height: 20px; fill: #f4c400;"><path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zM11 9h2V7h-2v2z"/></svg>
            <span style="font-weight: 600; font-size: 15px;">About</span>
          </div>
          <span style="color: #666; font-size: 18px;">&rsaquo;</span>
        </a>
      </div>
    </div>

  </div>
</section>

</main>

<nav class="bottom-nav" id="bottomNav">
  <a href="/" class="bottom-nav-item" id="navHome"><div class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg></div><span>Home</span></a>
  <a href="/live-tv" class="bottom-nav-item" id="navChannels"><div class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M21 3H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h5v2h8v-2h5c1.1 0 1.99-.9 1.99-2L23 5c0-1.1-.9-2-2-2zm0 14H3V5h18v12z"/></svg></div><span>Channels</span></a>
  <a href="/movies" class="bottom-nav-item" id="navMovies"><div class="bottom-nav-icon"><svg viewBox="0 0 24 24"><path d="M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z"/></svg></div><span>Library</span></a>

</nav>
