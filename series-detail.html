<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="Meddy API — Series Details">
<title>Series Details — Meddy API</title>
<link rel="stylesheet" href="/css/style.css">
<style>
.series-hero {
  position: relative;
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  padding: 60px 5% 40px;
  border-radius: 12px;
  margin-bottom: 30px;
  overflow: hidden;
}
.series-hero::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(18,18,18,0.85) 0%, rgba(18,18,18,0.98) 100%);
  z-index: 1;
}
.series-hero-content {
  position: relative;
  z-index: 2;
  display: flex;
  gap: 30px;
  flex-wrap: wrap;
  align-items: flex-start;
}
.series-poster-box {
  width: 240px;
  flex-shrink: 0;
  border-radius: 8px;
  overflow: hidden;
  box-shadow: 0 8px 24px rgba(0,0,0,0.6);
  background: #111;
  aspect-ratio: 2/3;
}
.series-poster-box img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.series-info-box {
  flex: 1;
  min-width: 280px;
}
.series-title-text {
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 12px;
  color: #fff;
}
.series-badge-row {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  margin-bottom: 16px;
  font-size: 0.9rem;
  color: #aaa;
}
.series-badge {
  background: #e50914;
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.8rem;
  font-weight: 600;
}
.series-overview-text {
  font-size: 1rem;
  line-height: 1.6;
  color: #ddd;
  margin-bottom: 24px;
}
.season-tabs {
  display: flex;
  gap: 10px;
  overflow-x: auto;
  padding-bottom: 10px;
  margin-bottom: 20px;
  border-bottom: 1px solid #333;
}
.season-tab {
  background: #222;
  color: #ccc;
  border: 1px solid #444;
  padding: 8px 18px;
  border-radius: 20px;
  cursor: pointer;
  white-space: nowrap;
  font-size: 0.95rem;
  transition: all 0.2s ease;
}
.season-tab.active {
  background: #e50914;
  color: #fff;
  border-color: #e50914;
}
.episodes-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
  margin-top: 20px;
}
.episode-card {
  background: #1e1e1e;
  border-radius: 8px;
  padding: 16px;
  border: 1px solid #2a2a2a;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  transition: transform 0.2s ease, border-color 0.2s ease;
  cursor: pointer;
}
.episode-card:hover {
  transform: translateY(-3px);
  border-color: #e50914;
}
.episode-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: #fff;
  margin-bottom: 8px;
}
.episode-meta {
  font-size: 0.85rem;
  color: #888;
  margin-bottom: 12px;
}
.btn-play-episode {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  background: #e50914;
  color: #fff;
  padding: 8px 12px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 0.85rem;
  font-weight: 600;
  border: none;
}
</style>
</head>
