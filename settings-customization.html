<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="Meddy API — Customization">
<title>Customization — Meddy API</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar" id="navbar">

Meddy <span>API</span>

<nav class="desktop-nav">

</nav>

<span class="search-icon"></span>

<button class="menu-button" id="menuButton" aria-label="Open navigation" aria-expanded="false">
<span class="menu-line"></span>
<span class="menu-line"></span>
<span class="menu-line"></span>
</button>
</div>
</div>
</header>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-content">
<div class="sidebar-section">
<div class="sidebar-section-title">Explore</div>
<a href="/" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Home</span></a>
<a href="/movies" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Library</span></a>
<a href="/series" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Series</span></a>

</div>
</div>
</aside>

<main>

<header class="page-header">
<div class="page-title-group">
<h1 class="page-title">Customization</h1>
</div>
</header>

<section class="section">
  <div style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;">
      <span style="font-weight: 600; font-size: 15px;">Theme Accent</span>
      <select id="prefAccent" style="background: #111; border: 1px solid rgba(255,255,255,0.2); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 13px; outline: none; cursor: pointer;">
        <option value="#f4c400">Sanyu Yellow (Default)</option>
        <option value="#e50914">Crimson Red</option>
        <option value="#10b981">Emerald Green</option>
      </select>
    </div>

  </div>
</section>

</main>



<script src="/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const accentEl = document.getElementById("prefAccent");
  if (accentEl) {
    accentEl.value = localStorage.getItem("sanyuhub_pref_accent") || "#f4c400";
    accentEl.addEventListener("change", (e) => {
      localStorage.setItem("sanyuhub_pref_accent", e.target.value);
    });
  }
});
</script>
</body>
</html>
