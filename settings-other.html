</div>

<!-- SIDEBAR OVERLAY -->
<div class="sidebar-overlay" id="sidebarOverlay"></div>

<!-- SIDEBAR -->
<aside class="sidebar" id="sidebar">
<div class="sidebar-content">
<div class="sidebar-section">
<div class="sidebar-section-title">Explore</div>
<a href="/" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Home</span></a>
<a href="/movies" class="sidebar-link"><span class="sidebar-link-left"><span class="sidebar-dot"></span>Library</span></a>

<main>

<header class="page-header">
<div class="page-title-group">
<h1 class="page-title">Other Settings</h1>
</div>
</header>

<section class="section">
  <div style="max-width: 600px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;">

    <div style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; padding: 18px 20px; display: flex; align-items: center; justify-content: space-between;">
      <div>
        <div style="font-weight: 600; font-size: 15px;">Clear Watch History</div>
        <div id="clearHistoryStatus" style="font-size: 12px; color: #888; margin-top: 4px;">Remove saved viewing progress</div>
      </div>
      <button id="clearHistoryBtn" style="background: rgba(217, 0, 0, 0.2); border: 1px solid #d90000; color: #ff6b6b; padding: 8px 16px; border-radius: 6px; font-weight: 600; font-size: 12px; cursor: pointer;">Clear</button>
    </div>

  </div>
</section>

</main>



<script src="/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const btn = document.getElementById("clearHistoryBtn");
  const status = document.getElementById("clearHistoryStatus");
  if (btn) {
    btn.addEventListener("click", () => {
      localStorage.removeItem("sanyuhub_continue_watching");
      if (status) status.textContent = "Watch history cleared successfully";
    });
  }
});
</script>
</body>
