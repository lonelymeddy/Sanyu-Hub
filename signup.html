<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#222222">
<meta name="description" content="SanyuHub — Sign Up">
<title>Sign Up — SanyuHub</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    background: radial-gradient(circle at center, rgba(30,30,30,0.9) 0%, rgba(10,10,10,0.98) 100%), url('/images/landing-collage.png') center/cover no-repeat;
    position: relative;
    box-sizing: border-box;
  }
  .auth-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(8px);
    z-index: 1;
  }
  .auth-card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 460px;
    background: rgba(20, 20, 20, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 32px 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    box-sizing: border-box;
  }
  .auth-brand {
    text-align: center;
    margin-bottom: 24px;
  }
  .auth-brand h1 {
    font-size: 28px;
    font-weight: 800;
    color: #ffffff;
    margin: 0;
    letter-spacing: -0.5px;
  }
  .auth-brand h1 span {
    color: #f4c400;
  }
  .auth-brand p {
    font-size: 14px;
    color: #aaaaaa;
    margin: 6px 0 0 0;
  }
  .nav-statement {
    background: rgba(244, 196, 0, 0.12);
    border: 1px solid rgba(244, 196, 0, 0.3);
    border-radius: 8px;
    padding: 10px 14px;
    text-align: center;
    font-size: 14px;
    color: #ffffff;
    margin-bottom: 20px;
  }
  .nav-statement a {
    color: #f4c400;
    font-weight: 700;
    text-decoration: none;
    margin-left: 6px;
  }
  .nav-statement a:hover {
    text-decoration: underline;
  }
  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #cccccc;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    height: 46px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 8px;
    padding: 0 14px;
    font-size: 14px;
    color: #ffffff;
    box-sizing: border-box;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: #f4c400;
    background: rgba(255, 255, 255, 0.09);
  }
  .payment-section {
    margin-top: 20px;
    border-top: 1px solid rgba(255, 255, 255, 0.1);
    padding-top: 18px;
  }
  .payment-title {
    font-size: 14px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 4px;
  }
  .payment-sub {
    font-size: 12px;
    color: #888888;
    margin-bottom: 14px;
  }
  .payment-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 16px;
  }
  .payment-card {
    border: 2px solid rgba(255, 255, 255, 0.12);
    border-radius: 10px;
    padding: 12px;
    background: rgba(255, 255, 255, 0.03);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
  }
  .payment-card.selected {
    border-color: #f4c400;
    background: rgba(244, 196, 0, 0.1);
  }
  .payment-card img {
    height: 38px;
    object-fit: contain;
    border-radius: 4px;
  }
  .payment-card span {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
  }
  .plan-select {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-bottom: 20px;
  }
  .plan-option {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 8px;
    cursor: pointer;
  }
  .plan-option.selected {
    border-color: #f4c400;
    background: rgba(244, 196, 0, 0.08);
  }
  .plan-option input {
    accent-color: #f4c400;
  }
  .plan-info {
    display: flex;
    flex-direction: column;
  }
  .plan-name {
    font-size: 13px;
    font-weight: 700;
    color: #ffffff;
  }
  .plan-desc {
    font-size: 11px;
    color: #888888;
  }
  .btn-submit {
    width: 100%;
    height: 48px;
    background: #f4c400;
    color: #000000;
    font-size: 15px;
    font-weight: 700;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }
  .btn-submit:hover {
    background: #ffd836;
  }
  .admin-info {
    margin-top: 18px;
    font-size: 11px;
    color: #666666;
    text-align: center;
    line-height: 1.4;
  }
  .error-msg {
    background: rgba(255, 77, 77, 0.15);
    border: 1px solid rgba(255, 77, 77, 0.4);
    color: #ff6b6b;
    font-size: 13px;
    padding: 10px;
    border-radius: 6px;
    margin-bottom: 14px;
    display: none;
  }
</style>
</head>
<body>

<div class="auth-container">
  <div class="auth-overlay"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <h1>Sanyu<span>Hub</span></h1>
      <p>Create your account & enjoy unlimited streaming</p>
    </div>

    <div class="nav-statement">
      Already have an account? <a href="/login">Log In</a>
    </div>

    <div id="errorMsg" class="error-msg"></div>

    <form id="signupForm">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="e.g. user@example.com">
      </div>

      <div class="form-group">
        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" required placeholder="e.g. 256702662846">
      </div>

      <div class="form-group">
        <label for="username">User Name</label>
        <input type="text" id="username" required placeholder="Choose a username">
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="Enter password">
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required placeholder="Re-enter password">
      </div>

      <div class="payment-section">
        <div class="payment-title">Select Plan & Payment Sector</div>
        <div class="payment-sub">Monthly Subscription: UGX 12,000 / month</div>

        <div class="plan-select">
          <label class="plan-option selected" id="planTrialLabel">
            <div style="display:flex; align-items:center; gap:10px;">
              <input type="radio" name="plan" value="trial" checked id="planTrial">
              <div class="plan-info">
                <span class="plan-name">2 Days Free Trial</span>
                <span class="plan-desc">Access full library free for 2 days</span>
              </div>
            </div>
            <span style="font-weight:700; color:#f4c400; font-size:13px;">FREE</span>
          </label>

          <label class="plan-option" id="planMonthlyLabel">
            <div style="display:flex; align-items:center; gap:10px;">
              <input type="radio" name="plan" value="monthly" id="planMonthly">
              <div class="plan-info">
                <span class="plan-name">12,000 UGX Monthly Subscription</span>
                <span class="plan-desc">Full monthly access with automatic billing option</span>
              </div>
            </div>
            <span style="font-weight:700; color:#ffffff; font-size:13px;">12,000 UGX</span>
          </label>
        </div>

        <div class="payment-title" style="margin-bottom:8px;">Payment Sector</div>
        <div class="payment-options">
          <div class="payment-card selected" id="sectorMtn" data-sector="MTN">
            <img src="/images/mtn-logo.png" alt="MTN Mobile Money">
            <span>MTN Sector</span>
          </div>
          <div class="payment-card" id="sectorAirtel" data-sector="Airtel">
            <img src="/images/airtel-logo.jpg" alt="Airtel Money">
            <span>Airtel Sector</span>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit">Complete Sign Up</button>
    </form>

    <div class="admin-info">
      Need assistance or admin support?<br>
      Email: delostvoyage@gmail.com | Contact: +256702662846
    </div>
  </div>
</div>

<script src="js/app.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    let selectedSector = "MTN";
    const mtnCard = document.getElementById("sectorMtn");
    const airtelCard = document.getElementById("sectorAirtel");
    const signupForm = document.getElementById("signupForm");
    const errorMsg = document.getElementById("errorMsg");

    const planTrialLabel = document.getElementById("planTrialLabel");
    const planMonthlyLabel = document.getElementById("planMonthlyLabel");
    const planTrialRadio = document.getElementById("planTrial");
    const planMonthlyRadio = document.getElementById("planMonthly");

    planTrialRadio.addEventListener("change", () => {
      planTrialLabel.classList.add("selected");
      planMonthlyLabel.classList.remove("selected");
    });
    planMonthlyRadio.addEventListener("change", () => {
      planMonthlyLabel.classList.add("selected");
      planTrialLabel.classList.remove("selected");
    });

    mtnCard.addEventListener("click", () => {
      selectedSector = "MTN";
      mtnCard.classList.add("selected");
      airtelCard.classList.remove("selected");
    });

    airtelCard.addEventListener("click", () => {
      selectedSector = "Airtel";
      airtelCard.classList.add("selected");
      mtnCard.classList.remove("selected");
    });

    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      errorMsg.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const phone = document.getElementById("phone").value.trim();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const selectedPlan = document.querySelector('input[name="plan"]:checked').value;

      if (password !== confirmPassword) {
        errorMsg.textContent = "Passwords do not match. Please re-confirm your password.";
        errorMsg.style.display = "block";
        return;
      }

      const isTrial = (selectedPlan === "trial");
      const subDays = isTrial ? 2 : 30;
      const expiryDate = new Date(Date.now() + subDays * 24 * 60 * 60 * 1000).toISOString();

      const userSession = {
        email: email,
        phone: phone,
        username: username,
        paymentSector: selectedSector,
        plan: selectedPlan,
        isTrial: isTrial,
        subscriptionExpiry: expiryDate,
        registeredAt: new Date().toISOString()
      };

      if (typeof SanyuAuth !== "undefined" && SanyuAuth.registerUser) {
        SanyuAuth.registerUser(userSession);
      } else {
        localStorage.setItem("sanyuhub_auth_user", JSON.stringify(userSession));
      }

      window.location.href = "/";
    });
  });
</script>
</body>
</html>
